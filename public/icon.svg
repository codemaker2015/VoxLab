<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="#ede9fe"/>
  <!-- Outer dashed arc (wide, top) -->
  <path d="M 13,54 A 37,37 0 0,1 87,54" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-dasharray="7,5"/>
  <!-- Inner solid arc (narrower, top) -->
  <path d="M 25,55 A 25,25 0 0,1 75,55" fill="none" stroke="#818cf8" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Center filled circle -->
  <circle cx="50" cy="55" r="14" fill="#6366f1"/>
  <!-- Bottom arc -->
  <path d="M 36,68 Q 50,78 64,68" fill="none" stroke="#818cf8" stroke-width="5.5" stroke-linecap="round"/>
</svg>
